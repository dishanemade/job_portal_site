<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav>
    <h2 class="logo">🚀 JobPortal</h2>
    <ul>
      <li>Home</li>
      <li>About Us</li>
      <li>Contact</li>
      <li>Login</li>
    </ul>
  </nav>

  <!-- Main Section -->
  <div class="container">

    <div class="left">
      <h1>Find Your Dream Job 🚀</h1>
      <p>Connecting talent with opportunity</p>

      <input type="text" id="search" placeholder="Search jobs..." onkeyup="searchJobs()">
      <div id="job-list"></div>
    </div>

    <!-- Login Card -->
    <div class="login-box">
      <h2>🔐 Login</h2>

      <input type="text" id="username" placeholder="Enter Username">
      <input type="password" id="password" placeholder="Enter Password">

      <button onclick="login()">Login</button>

      <p>Don't have an account? <span>Register</span></p>
    </div>

    <div id="job-list">
        <div class="job">Frontend Developer</div>
        <div class="job">Backend Developer</div>
        <div class="job">Full Stack Developer</div>
        <div class="job">Data Analyst</div>
        <div class="job">Machine Learning Engineer</div>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
